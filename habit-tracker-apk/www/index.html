<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Habit tracker with measurable and tick habits, weekly goals, Pomodoro timers and a dashboard. Works offline; data stays on your phone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Habit Tracker</title>
<style>
:root{
  --bg:#0A0A0A; --card:#161616; --card2:#1F1F1F; --line:#2A2A2A;
  --text:#F1F1F1; --muted:#8E8E8E; --g:#55C878; --g-ink:#04170A; --danger:#FF6B6B;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  overscroll-behavior:none;
  font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,.wheel:focus-visible{outline:2px solid var(--g);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg{flex:none}

.app{max-width:480px;margin:0 auto;padding:18px 16px 160px}

/* header + tabs */
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:48px}
.hd h1{font-size:24px;font-weight:500;letter-spacing:.005em}
.hd .sub{color:var(--muted);font-size:14px;margin-top:2px}
.hd-ic{display:flex;gap:2px;margin-right:-8px}
.ib{width:46px;height:46px;border:0;background:none;color:#9a9a9a;display:grid;place-items:center;border-radius:50%}
.ib.g{color:var(--g)}
.ib svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;border-bottom:1.5px solid var(--line);margin-bottom:16px}
.tabs button{flex:1;position:relative;background:none;border:0;padding:14px 0 16px;font-size:19px;color:#b9b9b9}
.tabs button+button::before{content:'';position:absolute;left:0;top:28%;height:44%;width:1.5px;background:#3a3a3a}
.tabs button.on{color:var(--g)}
.tabs button.on::after{content:'';position:absolute;left:14%;right:14%;bottom:-1.5px;height:3px;border-radius:3px;background:var(--g)}
.filters{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:15px;border:1.5px solid var(--line);background:none;color:#a8a8a8;font-size:16px;white-space:nowrap;flex:none}
.fchip svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fchip.on{border-color:var(--g);color:var(--g);background:rgba(85,200,120,.09)}
.fchip.add{border-color:rgba(85,200,120,.55);color:var(--g)}

/* habit cards */
.hc{position:relative;background:var(--card);border:1.5px solid var(--hb,var(--line));border-radius:26px;padding:16px 16px 18px;margin-bottom:16px}
.hc-top{display:flex;align-items:center;gap:14px}
.hi{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none;background:var(--hbg,var(--card2))}
.hi.sm{width:44px;height:44px;font-size:21px}
.hmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hname{font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;color:var(--muted);font-size:14px}
.hsub svg{width:14px;height:14px;fill:currentColor}
.hsub .dot{width:4px;height:4px;border-radius:50%;background:var(--muted)}
.hsub b{color:var(--text);font-weight:500}
.hsub b.ok{color:var(--g)}
.kebab{width:38px;height:38px;border-radius:50%;border:0;background:none;color:#cfcfcf;display:grid;place-items:center;flex:none;margin-right:-8px}
.kebab:hover{background:var(--card2)}
.add{width:46px;height:46px;border-radius:15px;border:0;background:var(--g);color:var(--g-ink);display:grid;place-items:center;flex:none}
.add svg{width:23px;height:23px}
.tk{position:relative;width:46px;height:46px;border-radius:50%;border:2px solid var(--hc);background:none;color:var(--g-ink);display:grid;place-items:center;flex:none}
.tk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tk.on{background:var(--hc)}
.tk.on svg{opacity:1}
.tk em{position:absolute;font-style:normal;font-size:12px;font-weight:700;color:var(--hc)}
.add:active,.tk:active{transform:scale(.93)}
.hdiv{height:1px;margin:14px 6px;background:linear-gradient(90deg,transparent,var(--hb,var(--line)),transparent)}
.bar{height:5px;background:var(--card2);border-radius:9px;overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--hc);transition:width .35s ease}
.grid{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:4px;background:var(--card2)}
.cell.today{outline:1.5px solid var(--text);outline-offset:1px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:10px}
.wl{color:var(--muted);font-size:15px}
.wl.t{color:#fff;font-weight:700}
.wb{width:100%;aspect-ratio:1/1.05;max-width:52px;border-radius:14px;border:1.5px solid #333;background:#262626;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.05;color:var(--hc)}
.wb b{font-size:18px;font-weight:500}
.wb small{font-size:11px;opacity:.8}
.wb.fut{background:var(--card);border-color:#262626;opacity:.7}
.wb.today{border:2px solid #fff}
.wb.on{background:var(--hc);border-color:var(--hc);color:var(--g-ink)}
.wb.on.today{border-color:#fff}
.wb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.menu{position:absolute;top:66px;right:14px;z-index:5;min-width:150px;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.65)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px;border-radius:10px}
.menu button:hover{background:rgba(255,255,255,.05)}
.menu .danger{color:var(--danger)}
.arch-toggle{width:100%;background:none;border:1.5px dashed var(--line);color:var(--muted);border-radius:18px;padding:13px;margin:0 0 14px}
.arch-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 12px;margin-bottom:10px;opacity:.85}
.arch-row .hname{font-size:16px}
.mini{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2)}
.mini.danger{color:var(--danger)}
.empty{text-align:center;padding:64px 24px;color:var(--muted)}
.empty-ic{font-size:44px;margin-bottom:10px}
.empty h2{color:var(--text);font-size:20px;font-weight:500;margin-bottom:6px}
.empty p{max-width:290px;margin:0 auto}
.sec{font-size:18px;font-weight:500;margin:26px 0 12px}

/* plan + tasks */
.prow{display:grid;grid-template-columns:76px 1fr;gap:10px;width:100%;background:none;border:0;padding:0 0 12px;text-align:left;align-items:center}
.prow.notime{grid-template-columns:1fr}
.ptime{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.pcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--hb,var(--line));border-radius:20px;padding:10px 12px}
.pstat{width:28px;height:28px;border-radius:50%;border:1.5px solid #3a3a3a;display:grid;place-items:center;flex:none}
.prow.done .pstat{background:var(--g);border-color:var(--g);color:var(--g-ink)}
.pstat svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.prow.done .pstat svg{opacity:1}
.now{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;padding-bottom:12px;color:var(--g);font-size:13px;font-weight:500}
.now i{height:2px;background:var(--g);border-radius:2px;box-shadow:0 0 8px rgba(85,200,120,.7)}
.trow{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:10px 8px 10px 12px;margin-bottom:10px}
.chk{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);background:none;display:grid;place-items:center;flex:none;color:var(--g-ink)}
.chk svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.trow.done .chk{background:var(--g);border-color:var(--g)}
.trow.done .chk svg{opacity:1}
.ttxt{flex:1;min-width:0;overflow-wrap:anywhere}
.trow.done .ttxt{color:var(--muted);text-decoration:line-through}
.x{width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--muted);font-size:26px;line-height:1;display:grid;place-items:center;flex:none}
.x:hover{background:var(--card2)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;z-index:20;pointer-events:none}
.navwrap{flex:1;display:flex;justify-content:center}
.nav{pointer-events:auto;display:flex;align-items:center;gap:2px;padding:6px;border-radius:999px;background:rgba(18,18,18,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1.5px solid rgba(85,200,120,.5);box-shadow:0 0 26px rgba(85,200,120,.22)}
.nav button{position:relative;height:50px;min-width:48px;padding:0 10px;border:0;background:none;border-radius:999px;color:#b5b5b5;display:flex;align-items:center;justify-content:center;gap:7px;font-size:16px;font-weight:500}
.nav button.on{background:var(--g);color:var(--g-ink);padding:0 16px}
.nav button.run::after{content:'';position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 2px #121212}
.nav button.on.run::after{background:var(--g-ink);box-shadow:0 0 0 2px var(--g)}
@media (max-width:420px){.nav button{min-width:42px;padding:0 8px}.nav button.on span{display:none}.nav button.on{padding:0;min-width:50px}}
.nav button span{display:none}
.nav button.on span{display:inline}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{pointer-events:auto;width:70px;height:70px;border-radius:24px;border:0;background:var(--g);color:var(--g-ink);display:grid;place-items:center;flex:none;box-shadow:0 10px 30px rgba(85,200,120,.3)}
.fab svg{width:32px;height:32px}
.fab:active{transform:scale(.95)}

/* bottom sheets */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0}
.sheet.enter{animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;gap:12px;padding:18px 14px 8px 18px}
.sh-head h2{font-size:21px;font-weight:500}
.sh-head .hmeta{flex:1}
.sh-body{flex:1;overflow-y:auto;padding:4px 18px 14px}
.sh-foot{display:flex;gap:10px;padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.btn{height:54px;border-radius:20px;border:0;font-weight:500;font-size:17px;padding:0 24px}
.btn.primary{background:var(--g);color:var(--g-ink);flex:1}
.btn.ghost{background:var(--card2);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#1a0505;flex:1}
.btn.line{background:none;border:1.5px solid rgba(85,200,120,.6);color:var(--g)}
.lbl{display:block;color:var(--muted);font-size:14px;margin:20px 0 8px}
.lbl.first{margin-top:10px}
.field{width:100%;height:56px;background:var(--card2);border:1px solid var(--line);border-radius:18px;color:var(--text);padding:0 16px;font:inherit;font-size:17px}
.field.big{height:70px;font-size:30px;font-weight:500;padding-right:74px}
.field.ta{height:200px;padding:12px 14px;font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:none;line-height:1.4}
.field::placeholder{color:#555}
.err{color:var(--danger);font-size:14px;margin-top:8px}
.hint{color:var(--muted);font-size:14.5px;margin-top:8px;line-height:1.45}
.amt{position:relative}
.suffix{color:var(--muted);font-size:15px}
.amt .suffix{position:absolute;right:16px;top:50%;transform:translateY(-50%);max-width:60px;overflow:hidden;text-overflow:ellipsis}
.quick{display:flex;gap:10px}
.chip{height:40px;padding:0 16px;border-radius:999px;background:var(--card2);border:1.5px solid var(--line);font-size:15px;white-space:nowrap;flex:none}
.chip.on{background:rgba(85,200,120,.14);border-color:var(--g);color:var(--g)}
.chip.q{flex:1;height:54px;font-size:18px;font-weight:500;border-radius:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:22px;padding:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.stat{background:var(--card2);border-radius:18px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:500;color:var(--g)}
.stat small{color:var(--muted);font-size:12.5px}
.irow{display:flex;align-items:center;gap:12px;margin-top:14px}
.irow .hmeta{gap:6px}
.irow .bar{margin:0}
.irow .pct{width:44px;text-align:right;font-size:14px;color:var(--muted)}

/* wizard */
.wz{position:fixed;inset:0;z-index:40;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.wz.enter{animation:slide .26s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.wz-top{padding:14px 12px 0}
.wz-back{width:48px;height:48px;border:0;background:none;display:grid;place-items:center;border-radius:50%}
.wz-back svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bars{display:flex;gap:8px;padding:10px 18px 0}
.bars i{flex:1;height:5px;border-radius:5px;background:#2b2b2b}
.bars i.on{background:var(--g)}
.wz-body{flex:1;overflow-y:auto;padding:26px 20px 14px}
.wz-body.ctr{display:flex;flex-direction:column;justify-content:center;padding-bottom:70px}
.wz-title{font-size:30px;font-weight:500;letter-spacing:-.01em;margin-bottom:22px}
.wz-foot{padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.wz-foot .fine{color:var(--muted);text-align:center;font-size:14.5px;margin-bottom:12px}
.cont{width:100%;height:60px;border-radius:22px;border:0;background:var(--g);color:var(--g-ink);font-size:20px;font-weight:500}
.cont.off{background:#262626;color:#6f6f6f}
.kind{width:100%;display:flex;align-items:center;gap:16px;text-align:left;padding:18px;border-radius:26px;border:2px solid var(--kb);background:var(--card);margin-bottom:14px}
.kind.tick{--kb:rgba(85,200,120,.35);--kt:rgba(85,200,120,.18);--kc:var(--g);--kbg:rgba(85,200,120,.13)}
.kind.measure{--kb:rgba(90,150,240,.45);--kt:rgba(90,150,240,.16);--kc:#5AA0F0;--kbg:rgba(90,150,240,.12)}
.kind.on{border-color:var(--kc);background:var(--kbg)}
.kind .kt{width:62px;height:62px;border-radius:18px;background:var(--kt);display:grid;place-items:center;color:var(--kc);flex:none}
.kind .kt svg{width:32px;height:32px}
.kind b{display:block;font-size:24px;font-weight:500}
.kind small{color:var(--muted);font-size:16px}
.radio{margin-left:auto;width:30px;height:30px;border-radius:50%;border:2px solid #666;flex:none;display:grid;place-items:center}
.radio svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.kind.on .radio{background:var(--kc);border-color:var(--kc);color:var(--g-ink)}
.seg{display:grid;gap:12px;margin-bottom:14px}
.seg button{min-height:62px;border-radius:20px;border:1.5px solid #333;background:none;font-size:17px;color:#cfcfcf;padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;line-height:1.15}
.seg button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.seg button.on{border-color:var(--g);color:var(--g);background:rgba(85,200,120,.1)}
.note{display:flex;gap:14px;align-items:flex-start;background:rgba(85,200,120,.06);border:1.5px solid rgba(85,200,120,.22);border-radius:20px;padding:16px;margin-bottom:22px;color:#d6d6d6;font-size:16.5px}
.note svg{width:24px;height:24px;fill:none;stroke:var(--g);stroke-width:1.8;margin-top:1px}
.pv{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:52px;margin:6px auto 30px}
.nm{width:100%;background:none;border:0;border-bottom:2px solid #333;color:var(--text);font:inherit;font-size:24px;text-align:center;padding:10px 6px 14px;border-radius:0}
.nm::placeholder{color:#575757}
.nm:focus{outline:none;border-color:var(--g)}
.sl{font-size:19px;font-weight:400;margin:32px 0 12px;color:#e8e8e8}
.pane{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ic{aspect-ratio:1;border-radius:16px;background:var(--card2);border:2px solid transparent;font-size:24px;padding:0}
.ic.on{border-color:var(--hc);background:rgba(255,255,255,.05)}
.swatches{display:flex;flex-wrap:wrap;gap:10px 12px;padding:4px 2px}
.sw{width:40px;height:40px;border-radius:50%;border:0;padding:0;position:relative}
.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px #fff}
.sw.cust{background:conic-gradient(#f87880,#ffa070,#ffd866,#7ed6a0,#5fd3da,#6aa9ff,#cf80ff,#f87880);overflow:hidden}
.sw.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.seeall{display:block;margin:12px auto 0;background:none;border:0;color:var(--g);font-size:18px;padding:6px 14px}
.stepper{display:flex;align-items:center;gap:0;background:var(--card2);border:1.5px solid var(--line);border-radius:18px;width:max-content}
.stepper button{width:56px;height:56px;border:0;background:none;font-size:26px}
.stepper b{min-width:52px;text-align:center;font-size:22px;font-weight:500}
.days{display:flex;gap:8px}
.days button{flex:1;height:52px;border-radius:16px;border:1.5px solid #333;background:none;font-size:18px}
.days button.on{border-color:var(--g);background:rgba(85,200,120,.12);color:var(--g)}
.tgt{display:flex;align-items:center;gap:12px}
.tgt .suffix{flex:none;max-width:140px}
.addrow{display:flex;gap:10px;margin-top:12px}
.addrow .btn{height:56px;padding:0 20px;flex:none}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.toggle-row .wz-title{margin:0}

  const t=p.timers.filter(x=>x.id===p.sel)[0];
  if(t.type!=='pomodoro'&&p.run.mode!=='focus'){p.run.mode='focus';p.run.status='idle'}

function weekTotal(h,start){let t=0;for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const v=val(h,dkey(d));t+=h.kind==='tick'?(v>=1?1:0):v}return Math.round(t*100)/100}
function streak(h){
  let n=0,g=0;
  if(isWeekly(h)){
    const s=weekStart(new Date());
    if(!(weekTotal(h,s)>=h.target))s.setDate(s.getDate()-7);
    while(weekTotal(h,s)>=h.target&&g++<520){n++;s.setDate(s.getDate()-7)}
    return n;
  }
  const d=new Date();
  if(!dayMet(h,dkey(d)))d.setDate(d.getDate()-1);

    return (val(h)>=1?1:0)+'/1 today';

}

function fmtMin(m){m=Math.round(m);return m<60?m+'m':Math.floor(m/60)+'h '+pad(m%60)+'m'}
const pmEligible=h=>!h.archived&&(h.kind==='tick'||h.unit==='min'||h.unit==='hr');
const isTimeHabit=h=>h.kind==='measure'&&(h.unit==='min'||h.unit==='hr');

let actx;

function pmBeep(){
  if(S.pomo.sound){
    try{
      pmAudio();const t0=actx.currentTime;
      [0,0.26,0.52].forEach((d,i)=>{
        const o=actx.createOscillator(),g=actx.createGain();
        o.frequency.value=i===2?988:784;o.connect(g);g.connect(actx.destination);
        g.gain.setValueAtTime(0.0001,t0+d);
        g.gain.exponentialRampToValueAtTime(0.25,t0+d+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.22);
        o.start(t0+d);o.stop(t0+d+0.26);
      });
    }catch(e){}
  }
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}

function pmPaint(rem){

function pmComplete(){
  const p=S.pomo,r=p.run,t=pmTimer();let msg;

/* where the time goes: time-based habits + timers (no double counting) */
function timeBuckets(days){
  const keys=[];
  for(let i=0;i<days;i++){const d=new Date();d.setDate(d.getDate()-i);keys.push(dkey(d))}
  const p=S.pomo,out=[],covered={};
  p.timers.forEach(t=>{const h=find(t.habitId);if(h&&isTimeHabit(h))covered[t.id]=true});
  S.habits.filter(isTimeHabit).forEach(h=>{
    let m=0;keys.forEach(k=>{m+=val(h,k)*(h.unit==='hr'?60:1)});
    if(m>0)out.push({name:h.name,icon:h.icon,color:h.color,min:m});
  });
  const by={};
  keys.forEach(k=>{
    const l=p.log[k];if(!l)return;
    if(l.by)Object.keys(l.by).forEach(id=>{by[id]=(by[id]||0)+l.by[id]});
    else if(l.m>0){const id=p.timers[0].id;by[id]=(by[id]||0)+l.m}
  });
  let other=0;
  Object.keys(by).forEach(id=>{
    const t=p.timers.filter(x=>x.id===id)[0];
    if(!t){other+=by[id];return}
    if(covered[id])return;
    if(by[id]>0)out.push({name:t.name,icon:t.icon,color:t.color,min:by[id]});
  });
  if(other>0)out.push({name:'Other timers',icon:'⏱️',color:'#8E8E8E',min:other});
  out.sort((a,b)=>b.min-a.min);
  return out;
}
function rangeSeg(){
  return '<div class="seg" style="grid-template-columns:repeat(3,1fr);margin:0 0 14px">'+RANGES.map(r=>'<button style="min-height:44px;font-size:15px;border-radius:16px" class="'+(ui.range===r[0]?'on':'')+'" data-act="range" data-v="'+r[0]+'" aria-pressed="'+(ui.range===r[0])+'">'+r[1]+'</button>').join('')+'</div>';
}
function donutHTML(b,total){
  const R=76,C=2*Math.PI*R,gap=b.length>1?3:0;
  let segs='',cum=0;
  b.forEach(x=>{
    const len=x.min/total*C;
    segs+='<circle cx="100" cy="100" r="'+R+'" stroke="'+x.color+'" stroke-dasharray="'+Math.max(len-gap,0.5).toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+(-cum).toFixed(2)+'" transform="rotate(-90 100 100)"/>';
    cum+=len;
  });
  return '<div class="donut" role="img" aria-label="'+fmtMin(total)+' tracked"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="'+R+'" stroke="#1c1c1c"/>'+segs+'</svg><div class="dn-c"><b>'+fmtMin(total)+'</b><small>tracked</small></div></div>';
}
function timeCard(){
  const days=+ui.range;
  let b=timeBuckets(days);
  const total=b.reduce((a,x)=>a+x.min,0);
  let html=rangeSeg();
  if(total<=0)return html+'<div class="pane"><p class="hint" style="margin:0">No time tracked in this period. Run a timer, or log minutes on a habit measured in min or hr.</p></div>';
  if(b.length>6){const rest=b.slice(5);b=b.slice(0,5).concat([{name:'Everything else',icon:'•',color:'#8E8E8E',min:rest.reduce((a,x)=>a+x.min,0)}])}
  html+='<div class="pane">'+donutHTML(b,total)+'<div>'+b.map(x=>'<div class="tl-r"><i style="background:'+x.color+'"></i><span class="tl-n">'+x.icon+' '+esc(x.name)+'</span><span class="tl-v">'+fmtMin(x.min)+'</span><span class="tl-p">'+Math.round(x.min/total*100)+'%</span></div>').join('')+'</div>'+
    '<p class="hint">'+(days>1?'Average '+fmtMin(total/days)+' a day. ':'')+'Most time went to '+esc(b[0].name)+'.</p></div>';

}

function bigRing(done,total){
  const C=2*Math.PI*50,p=total?done/total:0;
  return '<div class="bigring" role="img" aria-label="'+done+' of '+total+' habits done today"><svg viewBox="0 0 120 120"><circle class="rt" cx="60" cy="60" r="50"/><circle class="rp" cx="60" cy="60" r="50" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 60 60)"/></svg><div><b>'+done+'/'+total+'</b><small>done today</small></div></div>';
}
function dsec(title,tab){return '<div class="dh"><h3>'+title+'</h3>'+(tab?'<button class="lk" data-act="tab" data-v="'+tab+'">See all</button>':'')+'</div>'}
function drow(h){
  const td=today(),weekly=isWeekly(h);
  const pct=weekly?Math.min(100,weekTotal(h,weekStart(new Date()))/h.target*100):Math.min(100,val(h)/dayGoal(h)*100);
  let action;
  if(h.kind==='tick'){
    if(weekly){const on=val(h,td)>=1;action='<button class="tk'+(on?' on':'')+'" data-act="wk-tick" data-id="'+h.id+'" data-date="'+td+'" aria-label="'+(on?'Clear today for ':'Tick today for ')+esc(h.name)+'">'+CHECK+'</button>'}
    else action=tickBtn(h);
  }else action='<button class="add" data-act="log" data-id="'+h.id+'" data-date="'+td+'" aria-label="Log '+esc(h.name)+'">'+PLUS+'</button>';
  return '<div class="drow" style="'+cardStyle(h)+'"><div class="hi sm">'+h.icon+'</div><div class="hmeta"><div class="hname" style="font-size:16px">'+esc(h.name)+'</div><div class="dprog"><i style="width:'+pct+'%"></i></div><div class="hsub">'+esc(progText(h))+'</div></div>'+action+'</div>';
}
function consistency(daily){
  if(!daily.length)return '';
  const bars=[];let sum=0,n=0;
  for(let i=13;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d);
    let tot=0,met=0;
    daily.forEach(h=>{if(h.created&&k<h.created)return;tot++;if(dayMet(h,k))met++});
    const pct=tot?met/tot:0;if(tot){sum+=pct;n++}
    bars.push({pct:pct,d:d,t:i===0});
  }
  return dsec('Consistency, last 14 days')+'<div class="pane"><div class="c14" role="img" aria-label="Share of daily habits completed each day for the last 14 days">'+bars.map(b=>'<div class="cb'+(b.t?' t':'')+'"><i style="height:'+Math.max(3,Math.round(b.pct*66))+'px"></i><span>'+b.d.getDate()+'</span></div>').join('')+'</div><p class="hint">'+(n?'You completed '+Math.round(sum/n*100)+'% of your daily habits on average.':'Nothing to measure yet.')+'</p></div>';
}

  const nowT=pad(now.getHours())+':'+pad(now.getMinutes()),rems=[];

  html+=dsec('Today\u2019s habits','habits')+(daily.length?daily.map(drow).join(''):'<div class="dempty">No daily habits yet. Tap + to create one.</div>');
  if(weekly.length)html+=dsec('Weekly goals','habits')+weekly.map(drow).join('');
  if(ranked.length)html+=dsec('Streaks')+'<div class="streakchips">'+ranked.slice(0,5).map(x=>'<span class="streakchip" style="'+cardStyle(x.h)+'">'+x.h.icon+' '+esc(x.h.name)+' <b>'+x.s+(isWeekly(x.h)?' wk':' d')+'</b></span>').join('')+'</div>';
  html+=consistency(daily);

  if(openT.length)html+=openT.slice(0,5).map(taskRow).join('')+(openT.length>5?'<p class="hint" style="text-align:center">+'+(openT.length-5)+' more</p>':'');
  else html+='<div class="dempty">'+(S.tasks.length?'All caught up.':'No tasks yet.')+'</div>';
  return html;
}

function initWheels(w){
  document.querySelectorAll('.wheel').forEach(el=>{

    el.addEventListener('scroll',()=>{

function renderOv(anim){
  const o=ui.ov,ovEl=$('#ov');

  let html='';
  switch(o.type){

    case 'log':html=logSheet(o);break;
    case 'task':html=taskSheet(o);break;
    case 'confirm':html=confirmSheet(o);break;
    case 'reset':html=resetSheet();break;
    case 'insights':html=insightsSheet();break;
    case 'backup':html=backupSheet(o);break;
    case 'settings':html=settingsSheet();break;
    case 'pomo-settings':html=pomoSettingsSheet();break;
    case 'pm-manual':html=manualSheet(o);break;
    case 'tm':html=timerSheet(o);break;
    case 'tm-del':html=tmDelSheet(o);break;
  }
  ovEl.innerHTML=html;

  const b=$('#ov .sh-body, #ov .wz-body');if(b)b.scrollTop=o.resetScroll?0:st;

function tickToday(h){
  const k=today(),goal=dayGoal(h),cur=val(h,k);
  if(cur>=goal){delete h.logs[k];toast('Cleared '+h.name)}
  else{h.logs[k]=cur+1;toast(cur+1>=goal?'Done: '+h.name:'Ticked '+(cur+1)+'/'+goal)}
  save();
}

  const o=ui.ov;if(!o||o.type!=='log')return;
  const h=find(o.id),v=parseFloat($('#logAmt').value),b=$('#logGo');

function handle(act,id,v,t){
  const o=ui.ov;let h;
  switch(act){
    case 'tab':ui.tab=v;window.scrollTo(0,0);break;
    case 'stab':ui.stab=v;ui.filter=null;ui.showArch=false;break;
    case 'filter':ui.filter=ui.filter===v?null:v;break;
    case 'fab':
      if(ui.tab==='tasks')openOv({type:'task',text:'',err:''});
      else if(ui.tab==='focus')openOv({type:'pm-manual',err:''});
      else openOv(newWiz());
      break;
    case 'open-insights':openOv({type:'insights'});break;
    case 'open-backup':openOv({type:'backup',err:''});break;
    case 'open-settings':openOv({type:'settings'});break;
    case 'set-ws':S.settings.weekStart=+v;save();break;
    case 'load-sample':S=norm(seed());save();closeOv();toast('Sample habits loaded');break;
    case 'reset-ask':openOv({type:'reset'});break;
    case 'reset-do':S=norm({habits:[],tasks:[],settings:{weekStart:S.settings.weekStart}});save();closeOv();toast('All data reset');break;
    case 'log':openOv({type:'log',id:id,date:t.dataset.date||today(),err:''});break;
    case 'plan-act':h=find(id);if(h.kind==='tick'){tickToday(h)}else{openOv({type:'log',id:id,date:today(),err:''})}break;
    case 'tick':tickToday(find(id));break;
    case 'wk-tick':
      h=find(id);const dk=t.dataset.date;
      if(val(h,dk)>=1)delete h.logs[dk];else h.logs[dk]=1;
      save();break;
    case 'menu':ui.menu=ui.menu===id?null:id;break;
    case 'edit':ui.menu=null;openOv(newWiz(find(id)));break;
    case 'archive':h=find(id);h.archived=true;save();toast('Archived '+h.name);break;
    case 'restore':h=find(id);h.archived=false;save();toast('Restored '+h.name);break;
    case 'delete':openOv({type:'confirm',id:id});break;
    case 'confirm-del':h=find(o.id);S.habits=S.habits.filter(x=>x.id!==o.id);save();closeOv();toast('Deleted '+h.name);break;
    case 'toggle-arch':ui.showArch=!ui.showArch;break;
    case 'close':closeOv();break;

    case 'q':{
      const inp=$('#logAmt'),cur=parseFloat(inp.value)||0;
      inp.value=num(cur+parseFloat(v));updateLogCta();return false;
    }
    case 'log-save':{
      const a=parseFloat($('#logAmt').value);
      if(!(a>0)){o.err='Enter an amount above 0.';break}
      h=find(o.id);
      const before=val(h,o.date);
      h.logs[o.date]=Math.round((before+a)*100)/100;
      save();closeOv();
      toast('Logged '+num(a)+' '+h.unit+(!isWeekly(h)&&before<h.target&&h.logs[o.date]>=h.target?'. Goal reached!':''));
      break;
    }
    case 'log-clear':h=find(o.id);delete h.logs[o.date];save();closeOv();toast('Cleared log');break;

    case 'wz-kind':
      o.d.kind=v;o.err={};
      if(v==='measure'&&o.d.freq==='multi')o.d.freq='once';
      break;
    case 'wz-quit':o.d.quit=v==='1';break;
    case 'wz-cat':o.cat=v;break;
    case 'wz-icon':o.d.icon=v;break;
    case 'wz-color':o.d.color=v;break;
    case 'wz-allcolors':o.allColors=!o.allColors;break;
    case 'wz-freq':o.d.freq=v;o.err={};break;
    case 'wz-cnt':o.d.count=String(Math.max(1,Math.min(20,(parseInt(o.d.count,10)||1)+parseInt(v,10))));break;
    case 'wz-days':o.d.days=+v;break;
    case 'wz-unit':o.d.unit=v;o.d.customUnit=false;o.err={};break;
    case 'wz-custom':o.d.customUnit=true;o.focus='wzCustom';break;
    case 'wz-tag':{
      const i=o.d.tags.indexOf(v);
      if(i>=0)o.d.tags.splice(i,1);else o.d.tags.push(v);
      break;
    }
    case 'wz-tagopen':o.tagOpen=!o.tagOpen;if(o.tagOpen)o.focus='wzNewTag';break;
    case 'wz-addtag':{
      const nt=(o.newTag||'').trim();
      if(nt){
        const all=CATS.concat(o.extraTags,o.d.tags),ki=all.map(x=>x.toLowerCase()).indexOf(nt.toLowerCase());
        if(ki<0){o.extraTags.push(nt);o.d.tags.push(nt)}
        else if(o.d.tags.indexOf(all[ki])<0)o.d.tags.push(all[ki]);
      }
      o.newTag='';o.focus='wzNewTag';
      break;
    }
    case 'wz-rem':o.d.remOn=!o.d.remOn;o.err={};break;
    case 'wz-ap':o.wap=v;break;
    case 'wheel-pick':{
      const el=document.querySelector('.wheel[data-wheel="'+t.dataset.w+'"]');
      if(el)el.scrollTo({top:(+t.dataset.i)*46,behavior:'smooth'});
      return false;
    }
    case 'wz-addtime':{
      const tv=to24(o);o.err={};
      if(o.d.reminders.indexOf(tv)>=0)o.err.time=fmtTime(tv)+' is already added.';
      else o.d.reminders.push(tv);
      break;
    }
    case 'wz-rmtime':o.d.reminders=o.d.reminders.filter(x=>x!==v);break;
    case 'wz-next':
      if(!stepValid(o)){setErr(o);break}
      o.err={};o.step++;o.resetScroll=true;break;
    case 'wz-back':
      if(o.step===1||(o.editId&&o.step===2)){closeOv();return true}
      o.err={};o.step--;o.resetScroll=true;break;
    case 'wz-save':{
      const d=o.d;
      if(d.remOn&&!d.reminders.length)d.reminders.push(to24(o));
      const tick=d.kind==='tick';
      let freq=d.freq;if(!tick&&freq==='multi')freq='once';
      const target=tick?(freq==='multi'?parseInt(d.count,10):freq==='weekly'?d.days:1):parseFloat(d.target);
      const data={kind:d.kind,quit:tick&&d.quit,name:d.name.trim(),icon:d.icon,color:d.color,freq:freq,target:target,unit:tick?'':unitOf(d),tags:d.tags.slice(),reminders:d.remOn?d.reminders.slice().sort():[]};
      let saved;
      if(o.editId){saved=find(o.editId);Object.keys(data).forEach(k=>{saved[k]=data[k]})}
      else{data.id=uid();data.archived=false;data.logs={};data.created=today();S.habits.push(data);saved=data}
      ui.tab='habits';ui.stab=tabFor(saved);ui.filter=null;
      toast(o.editId?'Changes saved':'Habit saved');
      save();closeOv();
      break;
    }

    case 'bk-restore':
      try{
        const p=JSON.parse($('#bk').value);
        if(!p||!Array.isArray(p.habits))throw new Error('bad');
        p.tasks=p.tasks||[];p.settings=p.settings||{weekStart:1};
        S=norm(p);save();closeOv();toast('Backup restored');
      }catch(e){o.err='That text is not a valid backup.'}
      break;
    case 'bk-copy':{
      const ta=$('#bk'),txt=ta.value,ok=()=>toast('Backup copied');
      const fallback=()=>{ta.select();try{document.execCommand('copy');ok()}catch(e){toast('Select the text to copy it')}};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fallback);else fallback();
      return false;
    }

    case 'range':ui.range=v;break;
    case 'pm-mode':{const r=S.pomo.run;if(pmTimer().type!=='pomodoro')break;r.mode=v;r.status='idle';r.endAt=0;r.remaining=pmDur(v);save();break}
    case 'pm-toggle':{
      const r=S.pomo.run;
      if(r.status==='running'){r.remaining=Math.max(0,r.endAt-Date.now());r.status='paused'}
      else{pmAudio();if(r.remaining<=0)r.remaining=pmDur(r.mode);r.endAt=Date.now()+r.remaining;r.status='running'}
      save();break;
    }
    case 'pm-reset':{const r=S.pomo.run;r.status='idle';r.endAt=0;r.remaining=pmDur(r.mode);save();break}
    case 'pm-skip':{
      const r=S.pomo.run;if(pmTimer().type!=='pomodoro')break;
      r.mode=r.mode==='focus'?'short':'focus';r.status='idle';r.endAt=0;r.remaining=pmDur(r.mode);save();break;
    }
    case 'pm-sel':S.pomo.sel=v;pmResetRun();save();break;
    case 'pm-new':openOv(newTm());break;
    case 'pm-edit':openOv(newTm(pmTimer()));break;
    case 'pm-create-habit':{
      const tm=pmTimer();
      const nh={id:uid(),name:tm.name,icon:tm.icon,color:tm.color,kind:'measure',freq:'once',quit:false,unit:'min',target:60,tags:tm.name.toLowerCase()==='study'?['Study']:[],reminders:[],archived:false,logs:{},created:today()};
      S.habits.push(nh);tm.habitId=nh.id;save();toast('Habit created and linked');break;
    }
    case 'open-pomo-settings':openOv({type:'pomo-settings'});break;
    case 'pm-step':{
      const k=t.dataset.k,rg=PM_RANGE[k],p=S.pomo;
      p[k]=Math.max(rg[0],Math.min(rg[1],p[k]+(+t.dataset.d)*rg[2]));
      if(k===p.run.mode&&p.run.status==='idle')p.run.remaining=pmDur(k);
      save();break;
    }
    case 'pm-tog':{const k=t.dataset.k;S.pomo[k]=!S.pomo[k];save();break}
    case 'pm-q':{const i=$('#pmMin');i.value=v;o.min=v;return false}
    case 'pm-mtimer':o.tid=v;break;
    case 'pm-manual-save':{
      const m=parseFloat($('#pmMin').value);
      if(!(m>0)){o.err='Enter the minutes you spent.';break}
      const tm=S.pomo.timers.filter(x=>x.id===o.tid)[0]||pmTimer();
      pmLog(tm,m);const h=pmCredit(tm,m);save();closeOv();
      toast('Added '+num(m)+' min to '+tm.name+(h?' and '+h.name:''));
      break;
    }

    case 'tm-tpl':{const x=TM_TEMPLATES[+v];o.d.name=x.name;o.d.icon=x.icon;o.d.color=x.color;o.d.ttype=x.ttype;o.d.minutes=String(x.minutes);ICONCATS.forEach(c=>{if(c.i.indexOf(x.icon)>=0)o.cat=c.n});o.err={};break}
    case 'tm-cat':o.cat=v;break;
    case 'tm-icon':o.d.icon=v;break;
    case 'tm-color':o.d.color=v;break;
    case 'tm-type':o.d.ttype=v;break;
    case 'tm-min':o.d.minutes=v;o.err={};break;
    case 'tm-link':o.d.habitId=v||null;break;
    case 'tm-save':{
      const d=o.d,mins=parseInt(d.minutes,10);o.err={};
      if(!d.name.trim())o.err.name='Give your timer a name.';
      if(!(mins>=1&&mins<=180))o.err.min='Enter a length from 1 to 180 minutes.';
      if(o.err.name||o.err.min)break;
      const data={name:d.name.trim(),icon:d.icon,color:d.color,type:d.ttype,minutes:mins,habitId:d.habitId};
      const p=S.pomo;
      if(o.id){const tm=p.timers.filter(x=>x.id===o.id)[0];Object.keys(data).forEach(k=>{tm[k]=data[k]});toast('Timer saved')}
      else{data.id=uid();p.timers.push(data);p.sel=data.id;toast('Timer added')}
      pmResetRun();ui.tab='focus';save();closeOv();
      break;
    }
    case 'tm-ask-del':openOv({type:'tm-del',id:o.id});break;
    case 'tm-del-do':{
      const p=S.pomo,id=o.id,tm=p.timers.filter(x=>x.id===id)[0];
      const hh=tm&&find(tm.habitId);
      if(hh&&isTimeHabit(hh))Object.keys(p.log).forEach(k=>{if(p.log[k].by)delete p.log[k].by[id]});
      p.timers=p.timers.filter(x=>x.id!==id);
      if(p.sel===id)p.sel=p.timers[0].id;
      pmResetRun();save();closeOv();toast('Timer deleted');
      break;
    }

    case 'task-toggle':S.tasks.forEach(x=>{if(x.id===id)x.done=!x.done});save();break;
    case 'task-del':S.tasks=S.tasks.filter(x=>x.id!==id);save();break;
    case 'task-save':{
      const tx=(o.text||'').trim();
      if(!tx){o.err='Write what needs doing.';break}
      S.tasks.unshift({id:uid(),text:tx,done:false});save();closeOv();toast('Task added');
      break;
    }
  }
  return true;
}
function after(){
  renderMain();
  if(ui.ov&&!skipOv)renderOv(false);
  skipOv=false;
}
function refreshContinue(){
  const o=ui.ov,b=$('#wzNext');
  if(o&&o.type==='wiz'&&b)b.classList.toggle('off',!stepValid(o));
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(ui.menu){ui.menu=null;renderMain()}return}
  const act=t.dataset.act;
  if(act==='scrim'){if(e.target===t)closeOv();return}
  if(act!=='menu')ui.menu=null;
  if(handle(act,t.dataset.id,t.dataset.v,t)===false)return;
  after();
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.f,o=ui.ov;
  if(!f||!o)return;
  if(o.type==='wiz'){
    if(f==='name')o.d.name=e.target.value;
    else if(f==='target')o.d.target=e.target.value;
    else if(f==='customVal')o.d.customVal=e.target.value;
    else if(f==='newTag')o.newTag=e.target.value;
    refreshContinue();
  }else if(o.type==='tm'){
    if(f==='tmname')o.d.name=e.target.value;else if(f==='tmmin')o.d.minutes=e.target.value;
  }else if(o.type==='pm-manual'&&f==='pmmin')o.min=e.target.value;
  else if(o.type==='task'&&f==='task')o.text=e.target.value;
  else if(o.type==='log'&&f==='amt')updateLogCta();
});
document.addEventListener('change',e=>{
  const o=ui.ov;
  if(o&&o.type==='wiz'&&e.target.dataset&&e.target.dataset.f==='cpick'){o.d.color=e.target.value;renderOv(false)}
});
document.addEventListener('keydown',e=>{
  const o=ui.ov;
  if(e.key==='Escape'){if(o)closeOv();else if(ui.menu){ui.menu=null;renderMain()}return}
  if(e.key!=='Enter'||!o)return;
  const f=e.target.dataset&&e.target.dataset.f;
  const map={newTag:'wz-addtag',task:'task-save',amt:'log-save',pmmin:'pm-manual-save',tmname:'tm-save',tmmin:'tm-save'};
  if(f&&map[f]){e.preventDefault();if(handle(map[f])!==false)after()}
});

renderMain();
setInterval(pmTick,250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pmTick();syncWake()}});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(lateTimer)toast('Your timer finished while the app was closed');
})();
</script>
</body>
</html>
