name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and dark bars
        continue-on-error: true
        run: |
          pip install pillow
          python3 scripts/set-icons.py
          sed -i -E 's/(name="colorPrimary(Dark)?">)#[0-9A-Fa-f]{6}/\1#0A0A0A/' android/app/src/main/res/values/colors.xml || true

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
